<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniMax-H3 and ComfyUI Gallery</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>MiniMax-H3 and ComfyUI Gallery</h1>
  <p class="links"><a href="https://github.com/tayaee/video-generation/">H3 setup &amp; prompt repo</a> · <a href="https://tayaee.github.io/video-generation/">Gallery</a></p>
  <nav id="works"></nav>
  <div id="controls">
    <button id="play-all" type="button">▶ Play all</button>
    <button id="pause-all" type="button">⏸ Pause all</button>
    <span id="status"></span>
  </div>
</header>
<main>
  <div id="table-wrap">
    <table id="grid">
      <thead><tr id="head-row"><th>shot</th></tr></thead>
      <tbody id="grid-body"></tbody>
    </table>
  </div>
  <details id="help">
    <summary>How to use</summary>
    <p>Pick a work above. Rows = shot numbers, columns = profiles (low to high quality). Click a thumbnail to play/pause.
    Empty cells are not generated yet. Metadata comes from each shot's sidecar JSON.</p>
  </details>
</main>
<script src="config.js"></script>
<script>var GALLERY_WORK = "matchgirl";</script>
<script src="app.js"></script>
</body>
</html>
